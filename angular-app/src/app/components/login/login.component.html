<div class="login-wrapper">
  <div class="login-card">
    <!-- Logo Section -->
    <div class="logo-section">
      <svg width="48" height="48" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="logo-icon">
        <circle cx="50" cy="50" r="48" fill="#6366F1"/>
        <path d="M50 20C33.431 20 20 33.431 20 50s13.431 30 30 30 30-13.431 30-30S66.569 20 50 20zm0 8c13.255 0 24 10.745 24 24S63.255 74 50 74s-24-10.745-24-24S36.745 28 50 28z" fill="white"/>
        <circle cx="50" cy="50" r="12" fill="#A5B4FC"/>
      </svg>
      <h2 class="app-title">SteadyPhoto</h2>
      <p class="app-subtitle">Sign in to your account</p>
    </div>

    <!-- Login Form -->
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
      
      <!-- Email Field -->
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="form-control"
          [(ngModel)]="email" 
          placeholder="you@example.com"
          #emailModel="ngModel"/>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-control"
          [(ngModel)]="password" 
          placeholder="••••••••"
          #passwordModel="ngModel"/>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <!-- Action Buttons -->
      <div class="form-actions">
        <button type="submit" [disabled]="isLoading" class="btn btn-login w-100">
          <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
          {{ isLoading ? 'Signing in...' : 'Login' }}
        </button>
        
        <button type="button" (click)="onReset()" [disabled]="isLoading" class="btn btn-reset">
          Reset
        </button>
      </div>
    </form>

    <!-- Register Link -->
    <div class="register-link">
      Don't have an account? 
      <a routerLink="/register" class="text-primary text-decoration-none">Register here</a>
    </div>
  </div>
</div>
