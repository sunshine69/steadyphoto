# =====================================================
# SteadyPhoto Production Docker Compose Configuration
# Uses pre-built image from Docker Hub with .env configuration
# =====================================================

# remember docker compose use current env var higher prio. then .env

services:
  db:
    image: ankane/pgvector:latest # Using a pre-built image with pgvector support
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432" # Only expose if you need direct DB access (e.g., for migrations)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - steadyphoto_network
    restart: unless-stopped

  app:
    image: ${DOCKER_IMAGE:-steadyphoto}:${DOCKER_TAG:-latest} # Pull from Docker Hub
    container_name: steadyphoto-app
    env_file: .env
    ports:
      - "${API_PORT}:${API_PORT}" # Host ${API_PORT} -> Container 8080 (Serves both UI (/ui) and API (/api/v1))
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      STORAGE_DIR: /app/storage
      API_PORT: ${API_PORT}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - app_storage:/app/storage # Persistent storage for media files
    depends_on:
      - db
    networks:
      - steadyphoto_network
    restart: unless-stopped

volumes:
  postgres_data:
  app_storage:

networks:
  steadyphoto_network:
    driver: bridge
