version: '3.8'

services:
  db:
    image: ankane/pgvector:latest # Using a pre-built image with pgvector support
    environment:
      POSTGRES_USER: steadyphoto
      POSTGRES_PASSWORD: password
      POSTGRES_DB: steadyphoto
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    image: steadyphoto:latest
    container_name: steadyphoto-app
    ports:
      - "8080:8080" # Serves both UI (/ui) and API (/api/v1)
    environment:
      DATABASE_URL: postgres://steadyphoto:password@db:5432/steadyphoto?sslmode=disable
      STORAGE_DIR: /app/storage
      API_PORT: :8080
    volumes:
      - app_storage:/app/storage # Persistent storage for media files
    depends_on:
      - db

volumes:
  postgres_data:
  app_storage:
