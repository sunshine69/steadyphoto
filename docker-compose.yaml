services:
  db:
    image: ankane/pgvector:latest # Using a pre-built image with pgvector support
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

  app:
    build: .
    image: steadyphoto:latest
    container_name: steadyphoto-app-dev
    env_file: .env
    ports:
      - "${API_PORT}:${API_PORT}" # Host ${API_PORT} -> Container 8080 (Serves both UI (/ui) and API (/api/v1))
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      STORAGE_DIR: /app/storage
      API_PORT: ${API_PORT}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - app_storage_dev:/app/storage # Persistent storage for media files
    depends_on:
      - db

volumes:
  postgres_data_dev:
  app_storage_dev:
